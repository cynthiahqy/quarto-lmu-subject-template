title: LMU Reveal.js
author: Cynthia Huang
version: 1.0.0
quarto-required: ">=1.6.0"
contributes:
  formats:
    revealjs:
      theme: [default, lmu-revealjs.scss]
      logo: logos/LMU_Logo_RGB_InvertiertGruen.png
      width: 1280
      height: 720
      slide-number: true
      chalkboard: true
      preview-links: auto
      transition: fade
      smaller: true
      code-line-numbers: true
