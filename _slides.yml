# Teaching-specific slide settings. Theme, logo and layout defaults come from the
# lmu-revealjs extension (_extensions/lmu). Load per deck with:
#   format: lmu-revealjs
#   metadata-files: [../_slides.yml]
execute:
  echo: true
  message: false
  warning: false

format:
  lmu-revealjs:
    chalkboard: true
    smaller: true
    code-line-numbers: true
    # footer: "site url here"
