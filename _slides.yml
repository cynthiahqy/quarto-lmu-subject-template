# Teaching-specific slide settings. Theme and layout defaults come from the
# lmu-revealjs extension (_extensions/lmu). Load per deck with:
#   format: lmu-revealjs
#   metadata-files: [../_slides.yml]
execute:
  echo: true
  message: false
  warning: false

format:
  lmu-revealjs:
    # Slide logo (white background). Differs from the navbar logo in _brand.yml.
    logo: _extensions/lmu/logos/LMU_Logo_RGB_InvertiertGruen.png
    width: 1280
    height: 720
    chalkboard: true
    smaller: true
    code-line-numbers: true
    # footer: "site url here"
