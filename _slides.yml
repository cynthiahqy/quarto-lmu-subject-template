# Teaching-specific slide settings. Theme, logo and layout defaults come from the
# lmu-revealjs extension (_extensions/lmu). Load per deck with:
#   format: lmu-revealjs
#   metadata-files: [../_slides.yml]
execute:
  echo: true
  message: false
  warning: false

format:
  lmu-revealjs:
    # Project-root-relative: the extension's own default logo path does not
    # resolve in a website subfolder, so the logo is set here.
    logo: shared/LMU_Logo_RGB_InvertiertGruen.png
    width: 1280
    height: 720
    chalkboard: true
    smaller: true
    code-line-numbers: true
    # footer: "site url here"
